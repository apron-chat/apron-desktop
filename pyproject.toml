[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apron-gtk"
version = "0.1.0"
description = "A native GTK4 Wayland client for Apron"
requires-python = ">=3.11"
dependencies = ["PyGObject>=3.42", "markdown-it-py>=3"]

[project.scripts]
apron-gtk = "apron_gtk.app:main"

[tool.setuptools.package-data]
apron_gtk = ["*.css"]

[tool.setuptools]
packages = ["apron_gtk"]
