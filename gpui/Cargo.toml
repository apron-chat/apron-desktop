[package]
name = "apron-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[features]
default = ["ui"]
ui = ["dep:gpui-kit", "dep:chrono"]
ui-tests = ["ui", "gpui-kit/test-support"]

[dependencies]
gpui-kit = { version = "=0.7.1", optional = true }
chrono = { version = "0.4", optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
async-channel = "2"
url = "2"
pulldown-cmark = "0.13"
tempfile = "3"

[[bin]]
name = "apron-gpui"
path = "src/main.rs"
required-features = ["ui"]

[profile.release]
debug = 0
strip = "debuginfo"

[profile.dev]
debug = 0
